# 테스트 설정. @ActiveProfiles("local", "test")로 켜서 DB 계정은 application-local.yml에서 가져오고,
# DB 주소와 스키마 관리 방식만 덮어쓴다. 테스트는 Flyway 마이그레이션으로 만든 스키마를 엔티티와 비교(validate)한다.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/fitness_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
  jpa:
    defer-datasource-initialization: false   # local의 시드 설정을 끈다 (Flyway와 함께 쓰면 순환 의존)
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never   # 초기 종목은 Flyway V3가 넣는다 (local의 시드 실행이 상속되면 중복 삽입)
  flyway:
    enabled: true
    clean-disabled: false   # 테스트 시작마다 clean → migrate (TestFlywayConfig)

fitness:
  jwt:
    # 테스트 전용 서명 키. 운영·로컬 키와 무관하고 테스트 밖에서는 쓰이지 않는다
    secret: rE3TJD05Nygql1g11IdoNuh6kn7r4hBNU55YHQOj1aoyI81+TgcqOIInL5Vc3E4v
  auth:
    dev-login:
      enabled: true   # 개발용 로그인(DEV)으로 테스트 회원을 만든다
    # 소셜 로그인 허용 aud. 공개키 주소(jwk-set-uri)는 FakeOidcInitializer가 가짜 공개키 서버로 넣는다
    kakao:
      audiences: test-kakao-app-key
    google:
      audiences: test-google-client-id
  security:
    extra-public-paths: /test-support/**   # 테스트 전용 컨트롤러는 인증 없이 호출
