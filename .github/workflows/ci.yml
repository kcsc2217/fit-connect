# 테스트 자동 실행. main에 push할 때와 PR마다 돈다.
# - test: 서버 ./gradlew test. main 보호 규칙의 필수 체크라 경로와 관계없이 항상 돈다.
#   통합 테스트가 쓰는 MySQL·Redis는 서비스 컨테이너로 띄운다 (로컬은 직접 설치, CLAUDE.md "로컬 실행 환경").
# - app: Flutter 앱 analyze + test. app/이 바뀐 경우에만 돈다 (계획 008).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새 커밋이 오면 이전 실행을 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4 # 운영과 같은 8.x 계열. V6의 utf8mb4_0900_bin을 지원한다
        env:
          # CI 안에서만 잠깐 뜨는 일회용 컨테이너의 값이라 비밀값이 아니다 (외부에서 접근할 수 없다)
          MYSQL_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Gradle 래퍼 검증 + 의존성·빌드 캐시 (두 번째 실행부터 빨라진다)
      - uses: gradle/actions/setup-gradle@v6

      - name: Test
        # 로컬은 DB 계정을 미커밋 application-local.yml에서 읽는다. CI에는 그 파일이 없어 환경변수로 넣는다.
        # DB 주소(fitness_test)는 application-test.yml 그대로라 "_test DB에서만 clean" 안전장치도 그대로 동작한다.
        env:
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: test
        run: ./gradlew test

      # 실패하면 어떤 테스트가 깨졌는지 HTML 리포트로 내려받아 볼 수 있게 한다
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7

  # 바뀐 경로 판별. app 작업을 돌릴지 정하는 데만 쓴다
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # PR에서 바뀐 파일 목록을 읽는다
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'app/**'
              - '.github/workflows/ci.yml'

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    # analyze·test는 iOS 빌드가 아니라 Linux로 충분하다
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0" # 로컬과 같은 버전 (CLAUDE.md "앱")
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      # 서버 테스트처럼 Asia/Seoul로 고정한다 (UTC 장비에서 시간대 버그가 숨지 않게)
      - run: flutter test
        env:
          TZ: Asia/Seoul
